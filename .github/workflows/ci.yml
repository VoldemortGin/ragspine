name: Python 3.12 Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-and-installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.6.2'
          enable-cache: true
      - name: Prepare the locked development environment
        run: uv sync --locked
      - name: Run the single offline project gate
        run: ./ci.sh
      - name: Install the default package with plain pip
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/enterprise-pdf-rag-installed"
          "$RUNNER_TEMP/enterprise-pdf-rag-installed/bin/python" -m pip install .
          "$RUNNER_TEMP/enterprise-pdf-rag-installed/bin/python" -m pip check
      - name: Smoke the installed CLI, SDK, renderer and app outside the checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/enterprise-pdf-rag-work"
          cd "$RUNNER_TEMP/enterprise-pdf-rag-work"
          export APP_ROOT_DIR="$PWD"
          export APP_DATA_DIR="$PWD/data"
          "$RUNNER_TEMP/enterprise-pdf-rag-installed/bin/enterprise-pdf-rag" --help
          "$RUNNER_TEMP/enterprise-pdf-rag-installed/bin/python" -I - <<'PY'
          import sys
          from hashlib import sha256
          from importlib.resources import files
          from pathlib import Path

          import enterprise_pdf_rag
          import fontTools
          import pdfspine
          import resvg_py
          from enterprise_pdf_rag.adapters.figure_reasoning import render_svg_png
          from enterprise_pdf_rag.adapters.http.app import create_app
          from enterprise_pdf_rag.adapters.source_profile import read_source_profile
          from enterprise_pdf_rag.figures.models import ExecutionMode

          assert Path(enterprise_pdf_rag.__file__).is_relative_to(Path(sys.prefix))
          assert files("enterprise_pdf_rag").joinpath("resources/aia-first-20-regions.json").is_file()
          with pdfspine.open() as document:
              document.new_page(width=10, height=10)
              pdf = document.tobytes()
          with pdfspine.open(stream=pdf) as document:
              profile = read_source_profile(document[0], source_sha256=sha256(pdf).hexdigest(), page_index=0)
              assert profile.sdk_version == pdfspine.__version__
          rendered = render_svg_png(b'<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10"><rect width="10" height="10" fill="red"/></svg>', width=10)
          assert rendered.width == rendered.height == 10
          assert create_app(mode=ExecutionMode.OFFLINE_DEMO).openapi()["paths"]
          PY

name: enterprise-pdf-rag-aia-review

services:
  api:
    build:
      context: ../..
      dockerfile: deployment/open-webui/backend.Dockerfile
    image: enterprise-pdf-rag-source-review-api:0.1.0.dev0
    init: true
    # Content-addressed files are owner-readable (0600); keep that protection.
    # Launch with AIA_REVIEW_UID=$(id -u) AIA_REVIEW_GID=$(id -g).
    user: "${AIA_REVIEW_UID:?Set AIA_REVIEW_UID to the asset owner's numeric UID}:${AIA_REVIEW_GID:?Set AIA_REVIEW_GID to the asset owner's numeric GID}"
    environment:
      APP_ROOT_DIR: /app
      APP_EXECUTION_MODE: aia-source-review
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - type: bind
        source: ../../data/output/aia-2026-interim
        target: /app/data/output/aia-2026-interim
        read_only: true
        bind:
          create_host_path: false
    networks: [source-review]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r = json.load(urllib.request.urlopen('http://127.0.0.1:8766/v1/models', timeout=3)); assert [m['id'] for m in r['data']] == ['aia-2026-interim-source-review-v1']"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  webui:
    build:
      context: ../..
      dockerfile: deployment/open-webui/webui.Dockerfile
    image: enterprise-pdf-rag-open-webui:0.11.3-guarded
    command: ["--data-dir", "/app/backend/data", "--profile", "aia-source-review"]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    ports:
      - "127.0.0.1:8767:8767"
    volumes:
      - aia-webui-data:/app/backend/data
    networks: [source-review]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8767/api/config', timeout=3).status == 200"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

# No runtime internet route; WebUI can reach only the selected source-review API.
networks:
  source-review:
    internal: true

# Private to this Compose project; no host HOME, Docker socket or other UI data.
volumes:
  aia-webui-data:

[project]
name = "enterprise-pdf-rag"
version = "0.1.0.dev0"
description = "Evidence-preserving PDF figure ingestion backend."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings[yaml]>=2.2,<3",
    "beartype",
    "jinja2",
    "fastapi",
    "uvicorn",
    "pdfspine==0.11.0",
    "resvg-py==0.5.0",
    "fonttools==4.65.0",
]

[project.scripts]
# console script: supports both uv development and standard pip installations.
# 这是「从包进入」的正规入口之一(见 standard.md §3),hook 必装上。
enterprise-pdf-rag = "enterprise_pdf_rag.cli:main"

[project.optional-dependencies]
# Compatibility aliases: both capabilities are now required default dependencies.
pdf = []
processing = []

[dependency-groups]
# 开发工具不是本包的运行时特性,进 PEP 735 组:裸 `uv sync` 默认装 dev 组
dev = [
    "mypy==2.3.0",
    "ruff==0.16.1",
    "pytest",
    "hypothesis",
    "httpx2>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_pdf_rag"]
# hatchling 默认把包目录下的非 .py 文件(如 prompts/*.md)一并打进 wheel

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# Ignored source assets and isolated validation environments are not project code.
exclude = ['^data/']
# 裸 `# type: ignore` 直接报错:必须写成 `# type: ignore[code]  # 理由`,
# 否则一条 ignore 会顺手关掉同一行上所有别的错误,而且没人知道它当初在压什么。
enable_error_code = ["ignore-without-code"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
# `ruff check --fix` 只准应用 safe fixes；unsafe fix 可能改变运行时语义或删注释，
# 必须由人单独审阅，不进入默认自动化工作流。
unsafe-fixes = false

[tool.ruff.lint]
# BLE:禁 `except Exception` 兜底(standard.md §9 的「严禁」,不能只写在文档里)
# PGH:blanket-type-ignore / blanket-noqa,补 ruff 侧的「压制必须带错误码」
# T20:禁 print,兑现「库代码只 getLogger」(§7.4);例外见 per-file-ignores
# E4/E7/E9 保留实质性 pycodestyle 诊断，把空格、缩进、引号、换行交给 formatter；
# 避开 Ruff 官方列出的 formatter 冲突规则。I 负责 import 排序，UP 负责安全现代化。
select = ["E4", "E7", "E9", "F", "I", "UP", "ANN", "B", "SIM", "RUF", "TID", "BLE", "PGH", "T20"]

[tool.ruff.lint.flake8-tidy-imports]
# 包内禁相对导入(§7.1)。check_conformance.py 也查这条,但 ruff 反馈更快、
# 且覆盖 tests/ 与 scripts/(那两处在包外,结构检查器不扫)。
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# PEP 563 是被官方放弃的过渡路径,注解一律保持「活对象」(理由见 standard.md §6)
"__future__.annotations".msg = "本规范禁用 from __future__ import annotations:注解保持活对象,前向/自引用类型加引号即可。"

[tool.ruff.lint.per-file-ignores]
# scripts/ 是命令行工具层,不是库代码:门检查器的输出契约就是 stdout
# (人可读报告 + 退出码),经 logging 转一手只会让它更难用。
# 这是刻意的、按目录划定的豁免,不是逐行 noqa;src/ 里的 T20 依旧全额生效。
"scripts/*.py" = ["T20"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]
filterwarnings = ["error"]   # warnings-as-errors;已知噪声依赖再逐条 ignore
